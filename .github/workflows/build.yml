name: Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o markscribe .

      - name: Vet
        run: go vet ./...

      # The tests need neither a token nor the network: they run against a
      # local stand-in for the GitHub API.
      - name: Test
        run: go test ./...

      # A template without calls to the GitHub API needs no token.
      - name: Render a template
        run: |
          ./markscribe -write test/static.md test/static.md.tpl
          test "$(cat test/static.md)" = "Rendered by markscribe."
